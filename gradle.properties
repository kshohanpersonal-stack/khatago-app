# Project-wide Gradle settings for KhataGo.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false
kotlin.code.style=official

# kapt diagnostics. `Could not load module <Error module>` is kapt declining to report the source
# errors it found; verbose kapt plus `mapDiagnosticLocations` are what make the real message visible.
# Logging only: no build semantics change and nothing is disabled.
kapt.verbose=true
