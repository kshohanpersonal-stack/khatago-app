# Robolectric runs the JVM unit tests that need real Android classes (SharedPreferences, Room,
# Context). Pinned to a single SDK so a result here is reproducible on CI rather than depending on
# whatever JDK happens to be installed.
#
# `android.app.Application` rather than KhataGoApplication: the production Application builds the whole
# container against a *file* database and schedules WorkManager, which makes a unit test slow, stateful
# and impossible to run twice. Every test builds exactly the object it needs (usually
# `KhataGoDatabase.createInMemory`), which is both faster and honest about its dependencies.
sdk=34
application=android.app.Application
