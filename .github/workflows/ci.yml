name: CI

# KhataGo has no runtime services to break, so CI's job is narrow and honest: prove the source is
# self-consistent, prove the unit and Robolectric suites pass, and prove an APK can actually be
# assembled. Nothing in here publishes anything, deploys anything, or touches a store.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # ONLY so a run can push its diagnosis to `ci-diagnostics`, and the generated
                    # Room schema baseline to `room-schema-baseline` (the build job's carrier step).
                    # The Actions log and artefact hosts are unreachable from some networks (this
                    # project's development sandbox among them); `git fetch` never is. Nothing else in
                    # CI writes, and no workflow path pushes to main.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: "8.9"   # must match gradle/wrapper/gradle-wrapper.properties
  JAVA_VERSION: "17"

jobs:
  # --------------------------------------------------------------------------- static gates
  # Cheap, no JDK, no dependency download. These catch the classes of mistake that are invisible
  # to a formatter and that a review reliably skips past: an import of a name that does not exist,
  # an unused import (a compile *warning* in this project, so it rots), a DAO call site that
  # drifted from its query, and an unbalanced brace from a hand-edit.
  checks:
    name: Static checks & hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: No signing material, keystore, or machine-local config committed
        run: |
          set -euo pipefail
          offenders=$(git ls-files | grep -Ei '\.(jks|keystore|p12|pem)$|(^|/)keystore\.properties$|(^|/)secrets\.properties$|(^|/)local\.properties$' || true)
          if [ -n "$offenders" ]; then
            echo "::error::Signing or local secret material must never be committed:"
            echo "$offenders"
            exit 1
          fi
          # A committed secret needs no clever pattern match: the files above are the only places
          # a secret could legitimately live, and none of them may be tracked.

      - name: No internet permission, and no networking dependency
        run: |
          set -euo pipefail
          manifest=app/src/main/AndroidManifest.xml
          if grep -q 'android.permission.INTERNET' "$manifest"; then
            echo "::error::KhataGo must not request INTERNET — that permission is the privacy claim."; exit 1
          fi
          if grep -REni 'okhttp|retrofit|ktor-|firebase|admob|crashlytics|play-services' app/build.gradle.kts build.gradle.kts settings.gradle.kts; then
            echo "::error::A networking/analytics SDK appeared in the build."; exit 1
          fi
          echo "permissions requested:"; grep -o 'android.permission\.[A-Z_]*' "$manifest" | sort -u

      - name: Set up Python for the repository's own checkers
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Static structure / import / symbol / DAO-call-site / workflow checks
        run: |
          set -uo pipefail
          rc=0
          # Every checker is given its root explicitly, and the same list appears in release.yml: a
          # default that quietly scans less than the docs promise is how a gate stops being one.
          for check in "tools/check_braces.py app/src" \
                       "tools/audit_imports.py app/src" \
                       "tools/audit_symbols.py app/src" \
                       "tools/audit_data_api.py app/src" \
                       "tools/check_yaml.py .github/workflows" \
                       "tools/check_workflows.py .github/workflows"; do
            echo "--- $check"
            python3 $check || rc=1
          done
          exit $rc

  # --------------------------------------------------------------------------- root-cause probe
  # `e: Could not load module <Error module>` is not the diagnosis. The Kotlin compiler emits it when
  # something in the compilation resolves to an *error descriptor* (a reference to a class/member that
  # does not exist) - see e.g. https://qiita.com/takahirom/items/e276cf344c96c40401b5, which pins it to
  # `ErrorModuleDescriptor` reaching the symbol table. In kapt's stub-generation mode the compiler
  # replaces its own diagnostics with exactly this one line, so the file and line number never appear
  # in the kapt task's output at all.
  #
  # This job therefore does not guess. It re-runs the same compilation four ways and publishes all four
  # unfiltered logs on the `ci-diagnostics` branch, so the next read names a file:line:col instead of a
  # symptom. Every probe is diagnostic-only: the `build` job below still compiles with kapt and Room
  # enabled, still runs the annotation processor, and still assembles the APK.
  diagnose-compile:
    name: Publish root-cause diagnostics
    runs-on: ubuntu-latest
    needs: build
    if: failure()
    permissions:
      contents: write   # ci-diagnostics branch only; the log/artefact hosts are unreachable from some networks
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Prove the publishing path works on its own
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Two rounds failed with nothing published at all, which meant the *publisher* was as suspect as
          # the probes. It is therefore exercised first, on its own, with no gradle, no functions and no
          # heredocs: if `marker.txt` shows up on the branch, the publisher is proven and anything missing
          # afterwards is the probe step's fault, not a mystery.
          set -uo pipefail
          d=$GITHUB_WORKSPACE/.diag
          mkdir -p "$d"
          cat > "$d/publish.sh" <<'PUBEOF'
          #!/usr/bin/env bash
          set -uo pipefail
          d="$GITHUB_WORKSPACE/.diag"
          r="$d/repo"
          rm -rf "$r"
          git init -q "$r"
          git -C "$r" config user.name ci-diagnostics
          git -C "$r" config user.email ci@localhost
          # Start from the branch's current tip so the build job's files (tests.log, diagnostics.md) are
          # still there when this job adds the probes: two force-pushes from scratch and only one of them
          # survives, and in run 34294889282 it was the wrong one.
          git -C "$r" fetch -q "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-diagnostics 2>/dev/null \
            && git -C "$r" checkout -q -B ci-diagnostics FETCH_HEAD 2>/dev/null || true
          for f in "$d"/*.md "$d"/*.txt "$d"/*.log; do
            [ -e "$f" ] && cp "$f" "$r/$(basename "$f")"
          done
          git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD > "$r/rev.txt" 2>/dev/null || true
          git -C "$r" add -A >/dev/null 2>&1 || true
          git -C "$r" commit -qm "diag $GITHUB_RUN_ID" >/dev/null 2>&1 || true
          if git -C "$r" push -q --force \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              HEAD:refs/heads/ci-diagnostics; then
            echo "PUBLISHED $(git -C "$r" ls-files | tr '\n' ' ')"
          else
            echo "::warning::publish push failed"
          fi
          PUBEOF
          chmod +x "$d/publish.sh"
          echo "publisher-ok; job=$GITHUB_JOB; gradle=$(command -v gradle || echo MISSING)" > "$d/publisher-note.md"
          "$d/publish.sh"

      # One step per probe, each publishing when it finishes - see the note on the probe steps below.
      # Never a `while read ... done < list` loop around Gradle: Gradle reads stdin, so such a loop makes
      # Gradle swallow the loop's own input and the remaining probes silently never run.
      #
      # `e: Could not load module <Error module>` from the build job is emitted when something resolves
      # to an *error descriptor* (a reference to a type or member that does not exist); in stub-generation
      # mode kapt substitutes that one line for the compiler's real diagnostics, so no file:line ever
      # reaches stdout. The kapt-less probes below are the path that prints file:line:col. The build job
      # itself still runs kapt, Room, the tests and both assemble tasks: nothing here weakens CI.
      - name: Prepare the probe harness
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          d=$GITHUB_WORKSPACE/.diag
          mkdir -p "$d"
          cat > "$d/no-kapt.init.gradle.kts" <<'INITEOF'
          gradle.beforeProject {
              tasks.matching { it.name.startsWith("kapt") }.configureEach { enabled = false }
          }
          INITEOF
          echo "gradle on PATH: $(command -v gradle || echo MISSING)" > "$d/tools.txt"
          java -version >> "$d/tools.txt" 2>&1 || true
          gradle --version >> "$d/tools.txt" 2>&1 || echo "gradle --version failed" >> "$d/tools.txt"
          : > "$d/report.md"
          {
            echo "# KhataGo compile diagnostics for run $GITHUB_RUN_ID"
            echo
            echo '```'
            cat "$d/tools.txt"
            echo '```'
            echo
          } >> "$d/report.md"
          echo "probes starting" > "$d/status.txt"
          # Publish before any long-running work: a report that says "gradle: MISSING" is worth more
          # than a perfect report whose step died before pushing.
          "$d/publish.sh" || echo "early publish failed"

      # One step per probe, and each one publishes when it finishes. The previous shape ran all four
      # probes inside one step, and in run 34291945797 that step was terminated right after probe 1:
      # the report showed `--- probe 1` as its last line with no exit code, and probes 2 to 4 - including
      # the unit-test compile, which is the only place a broken *test* source shows up - never reached
      # the branch. A step that publishes its own result cannot lose the next one's.
      #
      # Probes 3 and 4 of that design (the stub task with incremental compilation off, and with no
      # configuration cache) are gone on purpose: across nine rounds they never printed anything the
      # kapt-less probes did not, and every probe that cannot report a file:line is time in which the job
      # can be cut off. The release compile takes their place, because phase 4 of this work needs the
      # release variant to compile and nothing else here proves it. kapt itself stays enabled in the real
      # build job: Room's processor and the APK need it, and no probe here weakens CI.
      - name: "Probe 1 - compileDebugKotlin with kapt disabled"
        shell: bash
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          d=$GITHUB_WORKSPACE/.diag
          gradle --no-daemon --console=plain --stacktrace -I "$d/no-kapt.init.gradle.kts" \
            :app:compileDebugKotlin </dev/null > "$d/p1.log" 2>&1
          rc=$?
          # Written before the report block, because the block is the part a torn-down job has been
          # caught losing: the exit code is the one fact a reader needs even when nothing else did.
          echo "probe1 exit=$rc" >> "$d/status.txt"
          {
            echo "## Probe 1 - compileDebugKotlin, kapt tasks disabled"
            echo
            echo "exit=$rc lines=$(grep -c '' "$d/p1.log" 2>/dev/null) errors=$(grep -cE '^e: ' "$d/p1.log" 2>/dev/null)"
            echo
            echo '```'
            grep -hE "^e: |^> Task|FAILURE:|BUILD (SUCCESSFUL|FAILED)" "$d/p1.log" 2>/dev/null | head -80
            echo '```'
            echo
          } >> "$d/report.md"
          "$d/publish.sh" || echo "publish after probe 1 failed"
          exit 0

      - name: "Probe 2 - compileDebugUnitTestKotlin with kapt disabled"
        shell: bash
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          d=$GITHUB_WORKSPACE/.diag
          gradle --no-daemon --console=plain --stacktrace -I "$d/no-kapt.init.gradle.kts" \
            :app:compileDebugUnitTestKotlin </dev/null > "$d/p2.log" 2>&1
          rc=$?
          # Written before the report block, because the block is the part a torn-down job has been
          # caught losing: the exit code is the one fact a reader needs even when nothing else did.
          echo "probe2 exit=$rc" >> "$d/status.txt"
          {
            echo "## Probe 2 - unit-test sources compile, kapt tasks disabled"
            echo
            echo "exit=$rc lines=$(grep -c '' "$d/p2.log" 2>/dev/null) errors=$(grep -cE '^e: ' "$d/p2.log" 2>/dev/null)"
            echo
            echo '```'
            grep -hE "^e: |^> Task|FAILURE:|BUILD (SUCCESSFUL|FAILED)" "$d/p2.log" 2>/dev/null | head -80
            echo '```'
            echo
          } >> "$d/report.md"
          "$d/publish.sh" || echo "publish after probe 2 failed"
          exit 0

      - name: "Probe 3 - compileReleaseKotlin with kapt disabled"
        shell: bash
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          d=$GITHUB_WORKSPACE/.diag
          gradle --no-daemon --console=plain --stacktrace -I "$d/no-kapt.init.gradle.kts" \
            :app:compileReleaseKotlin </dev/null > "$d/p3.log" 2>&1
          rc=$?
          # Written before the report block, because the block is the part a torn-down job has been
          # caught losing: the exit code is the one fact a reader needs even when nothing else did.
          echo "probe3 exit=$rc" >> "$d/status.txt"
          {
            echo "## Probe 3 - release variant compiles, kapt tasks disabled"
            echo
            echo "exit=$rc lines=$(grep -c '' "$d/p3.log" 2>/dev/null) errors=$(grep -cE '^e: ' "$d/p3.log" 2>/dev/null)"
            echo
            echo '```'
            grep -hE "^e: |^> Task|FAILURE:|BUILD (SUCCESSFUL|FAILED)" "$d/p3.log" 2>/dev/null | head -80
            echo '```'
            echo
          } >> "$d/report.md"
          echo "PROBES FINISHED" >> "$d/status.txt"
          # The report is finalised here too, not only in the step below: that step is what a torn-down
          # job was caught losing in run 34294256615, and a report without its status tail reads like an
          # investigation that was never finished. The later append is idempotent enough to be harmless.
          {
            echo
            echo "## status"
            echo
            echo "```"
            tail -20 "$d/status.txt"
            echo "```"
          } >> "$d/report.md"
          "$d/publish.sh" || echo "publish after probe 3 failed"
          exit 0

      - name: Publish probes and report
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          d=$GITHUB_WORKSPACE/.diag
          mkdir -p "$d"
          cp /tmp/tests.log "$d/tests.log" 2>/dev/null || echo "no tests.log" > "$d/tests.log"
          tail -400 /tmp/tests.log > "$d/tests-tail.txt" 2>/dev/null || true
          # If the probe step died before it could write a report, say so loudly instead of publishing
          # an empty file that reads like "the probes found nothing".
          if [ ! -s "$d/report.md" ]; then
            {
              echo "# KhataGo diagnostics for run $GITHUB_RUN_ID"
              echo
              echo "**The probe step produced no report.** Its trace and status are below; whatever is in"
              echo "them is the answer to why (a shell problem in CI, not a clean build)."
              echo '```'
              tail -40 "$d/status.txt" "$d/trace.txt" 2>/dev/null
              echo '```'
            } > "$d/report.md"
          else
            { echo "## status"; echo; echo '```'; cat "$d/status.txt" 2>/dev/null; tail -40 "$d/trace.txt" 2>/dev/null; echo '```'; } >> "$d/report.md"
          fi
          if ! "$d/publish.sh"; then
            # The helper is written by an earlier step. If it is absent, unreadable or itself broken, the
            # fallback below publishes the same bytes with no shared state. Silence here is what cost the
            # last three rounds: a diagnose job that fails *and* publishes nothing is worse than one that
            # publishes a half-truth.
            echo "::warning::publish.sh failed - using the inline fallback"
            r=$(mktemp -d)
            git init -q "$r"
            git -C "$r" config user.name ci-diagnostics
            git -C "$r" config user.email ci@localhost
            cp "$d"/* "$r"/ 2>/dev/null || true
            git -C "$r" add -A
            git -C "$r" commit -qm "diag fallback $GITHUB_RUN_ID"
            git -C "$r" push -q --force \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              HEAD:refs/heads/ci-diagnostics && echo "PUBLISHED via fallback" || echo "::error::both publishers failed"
          fi


  # --------------------------------------------------------------------------- build + test
  build:
    name: Test, lint and assemble
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # The wrapper jar is intentionally not committed (see README: a binary blob nobody can
      # review does not belong in a repository whose claim is auditability), so the pinned Gradle
      # distribution is installed here instead. Pinning is what keeps this job reproducible either way.
      - name: Set up Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Unit tests (JVM + Robolectric)
        id: tests
        run: |
          set -uo pipefail
          gradle --no-daemon :app:testDebugUnitTest --stacktrace 2>&1 | tee /tmp/tests.log
          exit "${PIPESTATUS[0]}"

      # The log/artefact hosts are not reachable from every reviewer's network (they were not from the
      # sandbox this project was written in), and a job summary is not readable through the API at all.
      # So a red run repeats itself twice: as *annotations*, which the checks API does serve, and as files
      # pushed to the throwaway `ci-diagnostics` branch, which `git fetch` can always read. Both are capped
      # deliberately - an unbounded error dump buries the one line that matters, which is exactly what the
      # first three versions of this step did to us.
      - name: Publish the gradle failure summary from the log we already have
        if: failure() && steps.tests.outcome == 'failure'
        run: |
          set -uo pipefail
          # Re-running the failing task here used to be this step's job, and it was a lie: the task fails
          # again with the same one-line message, so the probe produced noise, not diagnosis. The real
          # error is extracted by the `diagnose-compile` job (see the comment there) - this step just
          # keeps the Gradle-level failure summary and the log tail beside the test output.
          grep -hB 2 -A 14 "What went wrong" /tmp/tests.log 2>/dev/null | head -120 > /tmp/build-errors.txt || true
          { echo; echo "===== tests.log tail ====="; tail -60 /tmp/tests.log; } >> /tmp/build-errors.txt 2>/dev/null || true
          cp /tmp/build-errors.txt /tmp/diagnostics-probe.txt 2>/dev/null || true
          head -40 /tmp/build-errors.txt 2>/dev/null || true
          exit 0

      - name: Surface the failure (only when tests did not pass)
        if: failure() && steps.tests.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ github.token }}   # scoped to this run, used only for the diagnostics push
        run: |
          emit() {
            # $1 = label, $2 = regex
            grep -hE "$2" /tmp/tests.log 2>/dev/null | head -10 | cut -c1-600 |
              while IFS= read -r line; do echo "::error file=build,title=$1::${line}"; done
          }
          echo "### Test failure detail" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -hE "(^| )e: |^> Task .*FAILED|FAILURE:|What went wrong|Caused by:|error:|unresolved reference:|expecting" \
            /tmp/tests.log 2>/dev/null | sed 's|file:///home/runner/work/[^/]*/[^/]*/||' | head -50 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -hA 6 "What went wrong" /tmp/tests.log 2>/dev/null | head -20 | cut -c1-600 |
            while IFS= read -r line; do echo "::error file=build,title=gradle-what-went-wrong::${line}"; done
          tail -6 /tmp/tests.log 2>/dev/null | cut -c1-600 | while IFS= read -r line; do
            echo "::error file=build,title=tests-log-tail::${line}"
          done
          emit "compile-error" "(^| )e: "
          emit "task-failed" "^> Task .*FAILED"
          emit "what-went-wrong" "What went wrong|Caused by:"
          emit "unresolved" "unresolved reference:|expecting"
          # The compiler sometimes reports through a worker whose output Gradle re-prefixes, so a
          # "^e:" anchor alone misses lines. Anything that smells like a diagnostic is fair game.
          emit "diagnostic" "error:|warning:|unresolved|expecting|Overload resolution|Type mismatch|No value passed|cannot be applied|None of the following"
          emit "kapt" "kapt|Kapt|NonExistentClass"
          # Gradle prints "Compilation error. See log for more details" and sends the actual compiler
          # output to the full log — exactly the channel a sandboxed reviewer cannot read. Re-running
          # the one failing task with --info puts every `e:` line on stdout; it costs ~30 s, and only
          # on a run that is already red.
          task=$(grep -hoE "Execution failed for task '[^']+'" /tmp/tests.log 2>/dev/null |
            head -1 | sed "s/Execution failed for task '//; s/'//")
          # A workflow-command value may not contain ':' — it terminates the `key=value` list, so the
          # task name is only used for the "which task" annotation and never inside a title.
          if [ -n "${task:-}" ]; then
            echo "::error file=build,title=failing-task::${task}"
          fi
          # Kotlin's compiler output lands in a daemon log, not in Gradle's stdout, and a re-run would
          # report UP-TO-DATE and print nothing — so the log is read directly, and the whole diagnosis is
          # filed as an issue (annotations are capped at 25 per check run and truncate aggressively).
          diag=/tmp/diagnostics.md
          {
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo '```'
            grep -hE "^e: |^w: file" /tmp/tests.log 2>/dev/null | head -40
            echo "--- probe"
            cat /tmp/diagnostics-probe.txt 2>/dev/null | head -80
            for f in $(find "$HOME/.gradle/daemon" "$GITHUB_WORKSPACE" -type f \( -name 'kotlin-daemon-err*' -o -name 'errors-*.txt' \) 2>/dev/null | head -4); do
              echo "--- $f"
              grep -hE "^e: |^w: |error:|Exception|Caused by" "$f" 2>/dev/null | head -40
            done
            grep -hE "^e: |error:|unresolved reference:|expecting" \
              "$GITHUB_WORKSPACE/app/build/tmp"/*.log 2>/dev/null | head -40
            echo '```'
          } > "$diag"
          # Gradle's stdout says "5 tests completed, 1 failed" and names nothing; the JUnit XML it writes
          # next to that has the test, the assertion message and the stack. Parse the XML, because a
          # `grep` over the log cannot tell a failing case from a class header, and this file is the whole
          # reason a red test run is diagnosable from a network that cannot read Actions logs.
          failures=/tmp/tests-failures.txt
          # Gradle's stdout says "5 tests completed, 1 failed" and names nothing; the JUnit XML written
          # beside it has the test, the assertion message and the stack. Parsed by a tool in the
          # repository rather than an inline script, so the same summary is available to anyone running
          # `./gradlew test` locally - and so a heredoc does not have to be indented inside a YAML block
          # scalar, which is a trap worth not setting for the next person.
          python3 tools/summarise_tests.py app/build/test-results/testDebugUnitTest > "$failures" \
            2>/dev/null || echo "no JUnit XML to read" > "$failures"
          cat "$failures" >> "$diag" 2>/dev/null || true
          # Publish the report on a throwaway branch. Everything else that could carry a log (the log
          # host, artefacts, check-run summaries, annotations past 25, workflow permissions for issues)
          # was either unreadable from a restricted network or silently capped; git is not.
          git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD > /tmp/rev.txt
          dest=$(mktemp -d)
          url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$dest" init -q -b ci-diagnostics
          git -C "$dest" config user.name ci-diagnostics && git -C "$dest" config user.email ci@localhost
          # Append to whatever is on the branch instead of force-pushing a tree of our own. The
          # `diagnose-compile` job publishes its probes to the same branch a minute later, and its
          # `--force` deleted this job's `tests.log` — the only file naming the failing tests — in run
          # 34294889282. Two publishers, one branch: the second must build on the first.
          if git -C "$dest" fetch -q "$url" ci-diagnostics 2>/dev/null; then
            git -C "$dest" checkout -q -B ci-diagnostics FETCH_HEAD 2>/dev/null || true
          fi
          cp "$diag" "$dest/diagnostics.md"
          cp /tmp/build-errors.txt "$dest/build-errors.txt" 2>/dev/null || true
          cp /tmp/tests.log "$dest/tests.log" 2>/dev/null || true
          cp /tmp/tests-failures.txt "$dest/tests-failures.txt" 2>/dev/null || true
          cp /tmp/rev.txt "$dest/rev.txt"
          git -C "$dest" add -A && git -C "$dest" commit -qm "diagnostics for $GITHUB_RUN_ID"
          git -C "$dest" push -q "$url" HEAD:refs/heads/ci-diagnostics || \
            git -C "$dest" push -q --force "$url" HEAD:refs/heads/ci-diagnostics || \
            echo "::error title=diagnostics-push-failed::could not push ci-diagnostics"
          echo "Tests failed; see the annotations on this check run."

      - name: Android Lint (report only, does not fail the build)
        if: always()
        run: gradle --no-daemon :app:lintDebug || true

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Assemble release APK (unsigned — signing is configured only in release.yml)
        run: gradle --no-daemon :app:assembleRelease
      # `exportSchema = true` + `room.schemaLocation` make Room write
      # app/schemas/com.khatago.finance.data.db.KhataGoDatabase/<version>.json while kapt runs, and that
      # file is the review artifact every later migration is diffed against. Two things were learned the
      # hard way here, and both shape this step:
      #  * the shared Gradle build cache makes kaptDebugKotlin a cache hit on a warm runner, so Room never
      #    re-runs and a plain "is app/schemas populated?" reads "no" although the config is right;
      #  * the sandbox this project was built in cannot reach GitHub's artefact or log hosts, only plain
      #    git - so whatever the step decides is published to `room-schema-baseline` as CARRIER.txt (plus
      #    the generated file when it differs), never to a branch with other publishers on it.
      # Drift is a warning, not a failure: a red build over an un-regenerated JSON teaches the wrong lesson
      # on a Friday, while the warning plus the carried file fixes it in one command.
      - name: Check the Room schema baseline against a real kapt run
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # A forced re-run of exactly one task: the shared Gradle build cache otherwise makes
          # kaptDebugKotlin a cache hit, and a cache hit cannot be asked whether it wrote a schema.
          gradle --no-daemon :app:kaptDebugKotlin --rerun >/dev/null 2>&1 || true
          fresh=$(find app/schemas -name '*.json' 2>/dev/null | head -1 || true)
          r=$(mktemp -d)
          git init -q "$r"
          git -C "$r" config user.name ci-diagnostics
          git -C "$r" config user.email ci@localhost
          git -C "$r" checkout -q -b room-schema-baseline
          if [ -z "$fresh" ]; then
            mode="kapt-emitted-nothing"
            echo "::warning::Room exported no schema even with the task forced - check room.schemaLocation"
          elif ! git ls-files --error-unmatch "$fresh" >/dev/null 2>&1; then
            mode="baseline-missing"
            echo "::warning::app/schemas holds no committed baseline - the generated file is on this branch"
          elif git diff --quiet HEAD -- "$fresh"; then
            mode="up-to-date"
            echo "the committed schema baseline matches what Room just generated"
          else
            mode="drift"
            echo "::warning::the committed baseline differs from what Room generated - review the diff on"
            echo "::warning::room-schema-baseline and commit it if the schema change is intended"
          fi
          {
            echo "mode: $mode"
            echo "file: ${fresh:-none}"
            echo "run: $GITHUB_RUN_ID"
            echo "commit: $GITHUB_SHA"
            if [ -n "$fresh" ]; then echo "sha256: $(sha256sum "$fresh" | cut -c1-64)"; fi
            if [ "$mode" = "drift" ]; then
              echo
              echo "git diff HEAD -- $fresh"
              git diff HEAD -- "$fresh" | head -80
            fi
          } > "$r/CARRIER.txt"
          if [ "$mode" != "up-to-date" ] && [ -n "$fresh" ]; then
            mkdir -p "$r/$(dirname "$fresh")"
            cp "$fresh" "$r/$fresh"
          fi
          git -C "$r" add -A
          git -C "$r" commit -qm "room schema carrier $GITHUB_RUN_ID ($mode)"
          git -C "$r" push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/room-schema-baseline \
            && echo "PUBLISHED room-schema-baseline ($mode)" \
            || echo "::warning::could not publish room-schema-baseline"

      - name: Formatting
        run: gradle --no-daemon spotlessCheck

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: |
            app/build/reports/tests
            app/build/test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v5
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Build summary"
            echo
            echo "- Unit + Robolectric suites ran on Gradle ${GRADLE_VERSION} / JDK ${JAVA_VERSION}"
            echo "- Debug and release APKs assembled (release unsigned on non-tag builds)"
            echo "- Room schema export: app/schemas (generated during kapt; commit the diff)"
          } >> "$GITHUB_STEP_SUMMARY"
