name: CI

# KhataGo has no runtime services to break, so CI's job is narrow and honest: prove the source is
# self-consistent, prove the unit and Robolectric suites pass, and prove an APK can actually be
# assembled. Nothing in here publishes anything, deploys anything, or touches a store.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # ONLY so a red run can push its own diagnostics to the `ci-diagnostics` branch.
                    # The Actions log and artefact hosts are unreachable from some networks (this
                    # project's development sandbox among them); `git fetch` never is. Nothing else in
                    # CI writes, and no workflow path pushes to main.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: "8.9"   # must match gradle/wrapper/gradle-wrapper.properties
  JAVA_VERSION: "17"

jobs:
  # --------------------------------------------------------------------------- static gates
  # Cheap, no JDK, no dependency download. These catch the classes of mistake that are invisible
  # to a formatter and that a review reliably skips past: an import of a name that does not exist,
  # an unused import (a compile *warning* in this project, so it rots), a DAO call site that
  # drifted from its query, and an unbalanced brace from a hand-edit.
  checks:
    name: Static checks & hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: No signing material, keystore, or machine-local config committed
        run: |
          set -euo pipefail
          offenders=$(git ls-files | grep -Ei '\.(jks|keystore|p12|pem)$|(^|/)keystore\.properties$|(^|/)secrets\.properties$|(^|/)local\.properties$' || true)
          if [ -n "$offenders" ]; then
            echo "::error::Signing or local secret material must never be committed:"
            echo "$offenders"
            exit 1
          fi
          # A committed secret needs no clever pattern match: the files above are the only places
          # a secret could legitimately live, and none of them may be tracked.

      - name: No internet permission, and no networking dependency
        run: |
          set -euo pipefail
          manifest=app/src/main/AndroidManifest.xml
          if grep -q 'android.permission.INTERNET' "$manifest"; then
            echo "::error::KhataGo must not request INTERNET — that permission is the privacy claim."; exit 1
          fi
          if grep -REni 'okhttp|retrofit|ktor-|firebase|admob|crashlytics|play-services' app/build.gradle.kts build.gradle.kts settings.gradle.kts; then
            echo "::error::A networking/analytics SDK appeared in the build."; exit 1
          fi
          echo "permissions requested:"; grep -o 'android.permission\.[A-Z_]*' "$manifest" | sort -u

      - name: Set up Python for the repository's own checkers
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Static structure / import / symbol / DAO-call-site / workflow checks
        run: |
          set -uo pipefail
          rc=0
          for check in "tools/check_braces.py app/src" \
                       "tools/audit_imports.py app/src" \
                       "tools/audit_symbols.py" \
                       "tools/audit_data_api.py" \
                       "tools/check_yaml.py .github/workflows"; do
            echo "--- $check"
            python3 $check || rc=1
          done
          exit $rc

  # --------------------------------------------------------------------------- root-cause probe
  # `e: Could not load module <Error module>` is not the diagnosis. The Kotlin compiler emits it when
  # something in the compilation resolves to an *error descriptor* (a reference to a class/member that
  # does not exist) - see e.g. https://qiita.com/takahirom/items/e276cf344c96c40401b5, which pins it to
  # `ErrorModuleDescriptor` reaching the symbol table. In kapt's stub-generation mode the compiler
  # replaces its own diagnostics with exactly this one line, so the file and line number never appear
  # in the kapt task's output at all.
  #
  # This job therefore does not guess. It re-runs the same compilation four ways and publishes all four
  # unfiltered logs on the `ci-diagnostics` branch, so the next read names a file:line:col instead of a
  # symptom. Every probe is diagnostic-only: the `build` job below still compiles with kapt and Room
  # enabled, still runs the annotation processor, and still assembles the APK.
  diagnose-compile:
    name: Publish root-cause diagnostics
    runs-on: ubuntu-latest
    needs: build
    if: failure()
    permissions:
      contents: write   # ci-diagnostics branch only; the log/artefact hosts are unreachable from some networks
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Set up the publishing helper
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          mkdir -p /tmp/diag
          # `git init` (rather than a clone) so every push replaces the branch with exactly what this run
          # wrote. The push is retried from several steps on purpose: publishing after each probe means a
          # later step blowing up cannot cost a whole CI round, because the branch already carries the
          # status line saying which step was last to finish.
          git init -q /tmp/diag/repo
          git -C /tmp/diag/repo config user.name ci-diagnostics
          git -C /tmp/diag/repo config user.email ci@localhost
          cat > /tmp/diag/push.sh <<'PUSHEOF'
          #!/usr/bin/env bash
          set -uo pipefail
          git -C /tmp/diag/repo add -A >/dev/null 2>&1 || true
          git -C /tmp/diag/repo commit -qm "diag $GITHUB_RUN_ID" >/dev/null 2>&1 || true
          git -C /tmp/diag/repo branch -qf ci-diagnostics
          git -C /tmp/diag/repo push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            ci-diagnostics:ci-diagnostics \
            && echo "published ci-diagnostics ($(git -C /tmp/diag/repo ls-files | wc -l) files)" \
            || echo "::warning::could not publish ci-diagnostics"
          PUSHEOF
          chmod +x /tmp/diag/push.sh
          echo "probe-step-failure" > /tmp/diag/progress.txt
          /tmp/diag/push.sh

      # Five explicit steps, never a loop over a task list: the loop body ran Gradle, Gradle read the
      # loop's own stdin, four of five probes silently never ran, and the report read "no diagnostics
      # anywhere" - which was a shell bug masquerading as a build result. Each step also publishes its own
      # status line before the next one starts, so an absent probe is provably absent rather than quiet.
      - name: Probe 1 - main compile with every kapt* task disabled (stub mode is what hides diagnostics)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          cat > /tmp/no-kapt.init.gradle.kts <<'INITEOF'
          gradle.beforeProject {
              tasks.matching { it.name.startsWith("kapt") }.configureEach { enabled = false }
          }
          INITEOF
          gradle --no-daemon --console=plain --stacktrace -I /tmp/no-kapt.init.gradle.kts \
            :app:compileDebugKotlin </dev/null >/tmp/diag/p1.log 2>&1
          rc=$?   # gradle's status, captured before the next command overwrites $?
          {
            echo "## Probe 1 - compileDebugKotlin, kapt tasks disabled (exit $rc)"
            echo '```'
            grep -hE "^(e: |w: file:)|^> Task|FAILURE:|BUILD (SUCCESSFUL|FAILED)|Caused by:|Exception is:" /tmp/diag/p1.log | head -40
            tail -80 /tmp/diag/p1.log
            echo '```'
          } > /tmp/diag/p1.md
          cp /tmp/diag/p1.log /tmp/diag/probe1.txt
          echo "probe1 done: $(wc -l < /tmp/diag/p1.log 2>/dev/null) lines, $(grep -cE "^(e: |w: file:)" /tmp/diag/p1.log 2>/dev/null) diagnostics" > /tmp/diag/progress.txt
          /tmp/diag/push.sh

      - name: Probe 2 - unit-test sources with kapt* disabled (least-covered source set)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          gradle --no-daemon --console=plain --stacktrace -I /tmp/no-kapt.init.gradle.kts \
            :app:compileDebugUnitTestKotlin </dev/null >/tmp/diag/p2.log 2>&1
          rc=$?   # gradle's status, captured before the next command overwrites $?
          {
            echo "## Probe 2 - compileDebugUnitTestKotlin, kapt tasks disabled (exit $rc)"
            echo '```'
            grep -hE "^(e: |w: file:)|^> Task|FAILURE:|BUILD (SUCCESSFUL|FAILED)|Caused by:|Exception is:" /tmp/diag/p2.log | head -40
            tail -80 /tmp/diag/p2.log
            echo '```'
          } > /tmp/diag/p2.md
          cp /tmp/diag/p2.log /tmp/diag/probe2.txt
          echo "probe2 done: $(wc -l < /tmp/diag/p2.log 2>/dev/null) lines, $(grep -cE "^(e: |w: file:)" /tmp/diag/p2.log 2>/dev/null) diagnostics" > /tmp/diag/progress.txt
          /tmp/diag/push.sh

      - name: Probe 3 - stub task, incremental compilation off (rules the IC state in or out)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          gradle --no-daemon --console=plain --stacktrace -Pkotlin.incremental=false \
            -Pkotlin.incremental.useModuleDetection=false :app:kaptGenerateStubsDebugKotlin \
            </dev/null >/tmp/diag/p3.log 2>&1
          rc=$?   # gradle's status, captured before the next command overwrites $?
          {
            echo "## Probe 3 - stub task, no incremental compilation (exit $rc)"
            echo '```'
            grep -hE "^(e: |w: file:)|^> Task|FAILURE:|BUILD (SUCCESSFUL|FAILED)|Caused by:|Exception is:" /tmp/diag/p3.log | head -40
            tail -60 /tmp/diag/p3.log
            echo '```'
          } > /tmp/diag/p3.md
          cp /tmp/diag/p3.log /tmp/diag/probe3.txt
          echo "probe3 done: $(wc -l < /tmp/diag/p3.log 2>/dev/null) lines, $(grep -cE "^(e: |w: file:)" /tmp/diag/p3.log 2>/dev/null) diagnostics" > /tmp/diag/progress.txt
          /tmp/diag/push.sh

      - name: Probe 4 - stub task without the configuration cache (rules out lazily-computed KGP inputs)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          gradle --no-daemon --console=plain --stacktrace --no-configuration-cache \
            :app:kaptGenerateStubsDebugKotlin </dev/null >/tmp/diag/p4.log 2>&1
          rc=$?   # gradle's status, captured before the next command overwrites $?
          {
            echo "## Probe 4 - stub task, no configuration cache (exit $rc)"
            echo '```'
            grep -hE "^(e: |w: file:)|^> Task|FAILURE:|BUILD (SUCCESSFUL|FAILED)|Caused by:|Exception is:" /tmp/diag/p4.log | head -40
            tail -60 /tmp/diag/p4.log
            echo '```'
          } > /tmp/diag/p4.md
          cp /tmp/diag/p4.log /tmp/diag/probe4.txt
          echo "probe4 done: $(wc -l < /tmp/diag/p4.log 2>/dev/null) lines, $(grep -cE "^(e: |w: file:)" /tmp/diag/p4.log 2>/dev/null) diagnostics" > /tmp/diag/progress.txt
          /tmp/diag/push.sh

      - name: Assemble and publish the report
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          dest=/tmp/diag/repo
          {
            echo "# KhataGo compile diagnostics for run $GITHUB_RUN_ID"
            echo
            echo "Commit: $(git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD) · progress: $(cat /tmp/diag/progress.txt 2>/dev/null)"
            echo
            echo "The line that the build job reports is \`e: Could not load module <Error module>\`. That is"
            echo "emitted when something resolves to an *error descriptor* (a reference to a type or member"
            echo "that does not exist) and kapt's stub mode substitutes it for the compiler's real diagnostics."
            echo "Probe 1 and 2 compile the same sources with the kapt tasks disabled, which is the path that"
            echo "names a file:line:col. Probes 3 and 4 rule out incremental compilation and the configuration"
            echo "cache. Read the probe sections first, then the raw tails."
            echo
            cat /tmp/diag/p1.md 2>/dev/null || echo "_probe 1 produced nothing_"
            echo
            cat /tmp/diag/p2.md 2>/dev/null || echo "_probe 2 produced nothing_"
            echo
            cat /tmp/diag/p3.md 2>/dev/null || echo "_probe 3 produced nothing_"
            echo
            cat /tmp/diag/p4.md 2>/dev/null || echo "_probe 4 produced nothing_"
          } > "$dest/kapt-disabled.md"
          cp /tmp/tests.log "$dest/tests.log" 2>/dev/null || true
          echo "The real \`e:\` lines are at the top of kapt-disabled.md; probe1.txt is the kapt-less main" > "$dest/README.txt"
          echo "compile verbatim." >> "$dest/README.txt"
          /tmp/diag/push.sh

  # --------------------------------------------------------------------------- build + test
  build:
    name: Test, lint and assemble
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # The wrapper jar is intentionally not committed (see README: a binary blob nobody can
      # review does not belong in a repository whose claim is auditability), so the pinned Gradle
      # distribution is installed here instead. Pinning is what keeps this job reproducible either way.
      - name: Set up Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Unit tests (JVM + Robolectric)
        id: tests
        run: |
          set -uo pipefail
          gradle --no-daemon :app:testDebugUnitTest --stacktrace 2>&1 | tee /tmp/tests.log
          exit "${PIPESTATUS[0]}"

      # The log/artefact hosts are not reachable from every reviewer's network (they were not from the
      # sandbox this project was written in), and a job summary is not readable through the API at all.
      # So a red run repeats itself twice: as *annotations*, which the checks API does serve, and as files
      # pushed to the throwaway `ci-diagnostics` branch, which `git fetch` can always read. Both are capped
      # deliberately - an unbounded error dump buries the one line that matters, which is exactly what the
      # first three versions of this step did to us.
      - name: Publish the gradle failure summary from the log we already have
        if: failure() && steps.tests.outcome == 'failure'
        run: |
          set -uo pipefail
          # Re-running the failing task here used to be this step's job, and it was a lie: the task fails
          # again with the same one-line message, so the probe produced noise, not diagnosis. The real
          # error is extracted by the `diagnose-compile` job (see the comment there) - this step just
          # keeps the Gradle-level failure summary and the log tail beside the test output.
          grep -hB 2 -A 14 "What went wrong" /tmp/tests.log 2>/dev/null | head -120 > /tmp/build-errors.txt || true
          { echo; echo "===== tests.log tail ====="; tail -60 /tmp/tests.log; } >> /tmp/build-errors.txt 2>/dev/null || true
          cp /tmp/build-errors.txt /tmp/diagnostics-probe.txt 2>/dev/null || true
          head -40 /tmp/build-errors.txt 2>/dev/null || true
          exit 0

      - name: Surface the failure (only when tests did not pass)
        if: failure() && steps.tests.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ github.token }}   # scoped to this run, used only for the diagnostics push
        run: |
          emit() {
            # $1 = label, $2 = regex
            grep -hE "$2" /tmp/tests.log 2>/dev/null | head -10 | cut -c1-600 |
              while IFS= read -r line; do echo "::error file=build,title=$1::${line}"; done
          }
          echo "### Test failure detail" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -hE "(^| )e: |^> Task .*FAILED|FAILURE:|What went wrong|Caused by:|error:|unresolved reference:|expecting" \
            /tmp/tests.log 2>/dev/null | sed 's|file:///home/runner/work/[^/]*/[^/]*/||' | head -50 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -hA 6 "What went wrong" /tmp/tests.log 2>/dev/null | head -20 | cut -c1-600 |
            while IFS= read -r line; do echo "::error file=build,title=gradle-what-went-wrong::${line}"; done
          tail -6 /tmp/tests.log 2>/dev/null | cut -c1-600 | while IFS= read -r line; do
            echo "::error file=build,title=tests-log-tail::${line}"
          done
          emit "compile-error" "(^| )e: "
          emit "task-failed" "^> Task .*FAILED"
          emit "what-went-wrong" "What went wrong|Caused by:"
          emit "unresolved" "unresolved reference:|expecting"
          # The compiler sometimes reports through a worker whose output Gradle re-prefixes, so a
          # "^e:" anchor alone misses lines. Anything that smells like a diagnostic is fair game.
          emit "diagnostic" "error:|warning:|unresolved|expecting|Overload resolution|Type mismatch|No value passed|cannot be applied|None of the following"
          emit "kapt" "kapt|Kapt|NonExistentClass"
          # Gradle prints "Compilation error. See log for more details" and sends the actual compiler
          # output to the full log — exactly the channel a sandboxed reviewer cannot read. Re-running
          # the one failing task with --info puts every `e:` line on stdout; it costs ~30 s, and only
          # on a run that is already red.
          task=$(grep -hoE "Execution failed for task '[^']+'" /tmp/tests.log 2>/dev/null |
            head -1 | sed "s/Execution failed for task '//; s/'//")
          # A workflow-command value may not contain ':' — it terminates the `key=value` list, so the
          # task name is only used for the "which task" annotation and never inside a title.
          if [ -n "${task:-}" ]; then
            echo "::error file=build,title=failing-task::${task}"
          fi
          # Kotlin's compiler output lands in a daemon log, not in Gradle's stdout, and a re-run would
          # report UP-TO-DATE and print nothing — so the log is read directly, and the whole diagnosis is
          # filed as an issue (annotations are capped at 25 per check run and truncate aggressively).
          diag=/tmp/diagnostics.md
          {
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo '```'
            grep -hE "^e: |^w: file" /tmp/tests.log 2>/dev/null | head -40
            echo "--- probe"
            cat /tmp/diagnostics-probe.txt 2>/dev/null | head -80
            for f in $(find "$HOME/.gradle/daemon" "$GITHUB_WORKSPACE" -type f \( -name 'kotlin-daemon-err*' -o -name 'errors-*.txt' \) 2>/dev/null | head -4); do
              echo "--- $f"
              grep -hE "^e: |^w: |error:|Exception|Caused by" "$f" 2>/dev/null | head -40
            done
            grep -hE "^e: |error:|unresolved reference:|expecting" \
              "$GITHUB_WORKSPACE/app/build/tmp"/*.log 2>/dev/null | head -40
            echo '```'
          } > "$diag"
          # Publish the report on a throwaway branch. Everything else that could carry a log (the log
          # host, artefacts, check-run summaries, annotations past 25, workflow permissions for issues)
          # was either unreadable from a restricted network or silently capped; git is not.
          git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD > /tmp/rev.txt
          dest=$(mktemp -d)
          git -C "$dest" init -q -b ci-diagnostics
          git -C "$dest" config user.name ci-diagnostics && git -C "$dest" config user.email ci@localhost
          cp "$diag" "$dest/diagnostics.md"
          cp /tmp/build-errors.txt "$dest/build-errors.txt" 2>/dev/null || true
          cp /tmp/tests.log "$dest/tests.log" 2>/dev/null || true
          cp /tmp/rev.txt "$dest/rev.txt"
          git -C "$dest" add -A && git -C "$dest" commit -qm "diagnostics for $GITHUB_RUN_ID"
          git -C "$dest" push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            ci-diagnostics:ci-diagnostics \
            || echo "::error title=diagnostics-push-failed::could not push ci-diagnostics"
          echo "Tests failed; see the annotations on this check run."

      - name: Android Lint (report only, does not fail the build)
        if: always()
        run: gradle --no-daemon :app:lintDebug || true

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Assemble release APK (unsigned — signing is configured only in release.yml)
        run: gradle --no-daemon :app:assembleRelease

      - name: Formatting
        run: gradle --no-daemon spotlessCheck

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: |
            app/build/reports/tests
            app/build/test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v5
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Build summary"
            echo
            echo "- Unit + Robolectric suites ran on Gradle ${GRADLE_VERSION} / JDK ${JAVA_VERSION}"
            echo "- Debug and release APKs assembled (release unsigned on non-tag builds)"
            echo "- Room schema export: app/schemas (generated during kapt; commit the diff)"
          } >> "$GITHUB_STEP_SUMMARY"
